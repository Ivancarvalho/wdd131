<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 600" width="320" height="600">
  <rect width="320" height="600" fill="#f8f9fa" stroke="#cccccc" stroke-width="2"/>
  <!-- Header -->
  <rect x="10" y="10" width="300" height="50" fill="#1b4332" rx="4"/>
  <text x="160" y="40" fill="#ffffff" font-family="sans-serif" font-size="16" text-anchor="middle">Header / Logo / Menu ☰</text>
  <!-- Hero -->
  <rect x="10" y="70" width="300" height="120" fill="#e2e8f0" rx="4"/>
  <text x="160" y="135" fill="#475569" font-family="sans-serif" font-size="14" text-anchor="middle">[ Banner Principal - Hero ]</text>
  <!-- Main Content Cards -->
  <rect x="10" y="200" width="300" height="100" fill="#ffffff" stroke="#d97706" stroke-width="2" rx="4"/>
  <text x="160" y="255" fill="#212529" font-family="sans-serif" font-size="14" text-anchor="middle">Destaques / Dicas de Segurança</text>
  <rect x="10" y="310" width="300" height="120" fill="#ffffff" stroke="#1b4332" stroke-width="2" rx="4"/>
  <text x="160" y="375" fill="#212529" font-family="sans-serif" font-size="14" text-anchor="middle">Resumo Meteorológico</text>
  <rect x="10" y="440" width="300" height="90" fill="#ffffff" stroke="#cccccc" stroke-width="1" rx="4"/>
  <text x="160" y="490" fill="#212529" font-family="sans-serif" font-size="14" text-anchor="middle">Chamada para Ação (CTA)</text>
  <!-- Footer -->
  <rect x="10" y="540" width="300" height="50" fill="#1b4332" rx="4"/>
  <text x="160" y="570" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">Rodapé / Copyright / Redes</text>
</svg>
